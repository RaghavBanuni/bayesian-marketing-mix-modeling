[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm"
version = "1.0.0"
description = "Bayesian marketing mix modelling from scratch: adstock, Hill saturation, analytic gradients, a NUTS sampler, convergence diagnostics, ROAS and budget allocation in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raghav Banuni" }]
keywords = [
    "marketing-mix-modeling",
    "bayesian",
    "nuts",
    "hamiltonian-monte-carlo",
    "adstock",
    "saturation",
    "roas",
    "budget-optimization",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mmm = "mmm.cli:main"

[project.urls]
Source = "https://github.com/RaghavBanuni/bayesian-marketing-mix-modeling"

[tool.setuptools]
packages = ["mmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: fits a real posterior and takes tens of seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"
